name: Portable checks
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s plugins/robin-biomethod/tests -v
      - run: python plugins/robin-biomethod/scripts/biomethod.py --version
